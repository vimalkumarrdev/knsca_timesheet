# Native nginx config for the non-Docker deployment path (see deploy/README.md).
# Adjust the paths below (/home/ec2-user/knsca_timesheet) to match your actual
# deployment location, and the domain name once you have one pointed here.

upstream app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name tscp.knsca.in;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /home/ec2-user/project/knsca_timesheet/staticfiles/;
    }

    location /media/ {
        alias /home/ec2-user/project/knsca_timesheet/media/;
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

