# Bootstrap config: plain HTTP reverse proxy to the Django app (gunicorn on :8000).
#
# This is what you start with on a fresh VPS, before a TLS certificate exists.
# Once certbot has issued a certificate (see ../nginx/README.md), replace the
# single server block below with the HTTPS pair further down (commented out).

client_max_body_size 20M;

upstream app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

